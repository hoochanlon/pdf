<!DOCTYPE html>
<html>
<head>
  <title>模块测试</title>
</head>
<body>
  <h1>测试配置加载</h1>
  <div id="result"></div>
  <script type="module">
    const result = document.getElementById('result');
    try {
      result.innerHTML = '正在加载...';
      
      // 测试各个模块
      const tests = [];
      
      // 1. 测试 config.js
      import('./config.js')
        .then(module => {
          tests.push('✓ config.js 加载成功');
          console.log('Config:', module.config);
        })
        .catch(e => {
          tests.push('✗ config.js 加载失败: ' + e.message);
        });
      
      // 2. 测试 state.js
      import('./js/state.js')
        .then(module => {
          tests.push('✓ state.js 加载成功');
          console.log('State:', module.state);
        })
        .catch(e => {
          tests.push('✗ state.js 加载失败: ' + e.message);
        });
      
      // 3. 测试 config-init.js
      import('./js/config-init.js')
        .then(module => {
          tests.push('✓ config-init.js 加载成功');
        })
        .catch(e => {
          tests.push('✗ config-init.js 加载失败: ' + e.message);
        });
      
      // 4. 测试 library.js
      import('./js/library.js')
        .then(module => {
          tests.push('✓ library.js 加载成功');
        })
        .catch(e => {
          tests.push('✗ library.js 加载失败: ' + e.message);
        });
      
      // 等待所有测试完成
      setTimeout(() => {
        result.innerHTML = tests.join('<br>');
      }, 2000);
      
    } catch (e) {
      result.innerHTML = '错误: ' + e.message;
      console.error(e);
    }
  </script>
</body>
</html>
