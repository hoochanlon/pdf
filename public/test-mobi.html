<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOBI 测试</title>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; }
    #status { padding: 10px; margin-bottom: 10px; background: #f0f0f0; }
    #container { width: 100%; height: 600px; border: 1px solid #ccc; }
    foliate-view { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <h1>MOBI 格式测试</h1>
  <div id="status">初始化中...</div>
  <button id="load-btn">加载 MOBI 文件</button>
  <div id="container"></div>

  <script type="module">
    const status = document.getElementById('status');
    const container = document.getElementById('container');
    const loadBtn = document.getElementById('load-btn');

    function log(msg) {
      console.log(msg);
      status.textContent = msg;
    }

    async function testMobi() {
      try {
        log('步骤 1: 导入 foliate-js...');
        await import('/lib/foliate-js/view.js');
        log('步骤 2: foliate-js 导入成功');

        // 等待自定义元素注册
        let retries = 0;
        while (typeof customElements.get('foliate-view') === 'undefined') {
          if (retries++ > 100) {
            throw new Error('foliate-view 未注册');
          }
          await new Promise(r => setTimeout(r, 50));
        }
        log('步骤 3: foliate-view 已注册');

        loadBtn.disabled = false;
        log('准备就绪，点击按钮加载 MOBI 文件');

      } catch (error) {
        log('错误: ' + error.message);
        console.error(error);
      }
    }

    loadBtn.addEventListener('click', async () => {
      try {
        log('创建 foliate-view 元素...');
        const view = document.createElement('foliate-view');
        container.innerHTML = '';
        container.appendChild(view);

        view.addEventListener('relocate', (e) => {
          log('位置变化: ' + JSON.stringify(e.detail));
        });

        view.addEventListener('load', () => {
          log('✓ MOBI 文件加载成功！');
        });

        const mobiUrl = '/uploads/存在与荒谬-潘绥铭.mobi';
        log('打开文件: ' + mobiUrl);
        
        await view.open(mobiUrl);
        log('✓ open() 调用成功');

      } catch (error) {
        log('加载失败: ' + error.message);
        console.error(error);
      }
    });

    testMobi();
  </script>
</body>
</html>
