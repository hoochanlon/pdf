<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>最小化测试</title>
</head>
<body>
  <h1>innerHTML querySelector 测试</h1>
  <div id="result"></div>
  
  <script>
    const item = document.createElement('li');
    const epub = false;
    
    // 完全相同的innerHTML
    item.innerHTML = `<span class="book-icon ${epub ? 'epub' : ''}"> ${epub ? 'EPUB' : 'PDF'}</span><span class="book-info"></span><span class="book-arrow">›</span>`;
    
    console.log('item.innerHTML:', item.innerHTML);
    console.log('item.querySelector(".book-info"):', item.querySelector('.book-info'));
    
    const bookInfo = item.querySelector('.book-info');
    
    if (bookInfo) {
      document.getElementById('result').innerHTML = '✓ book-info 找到了！<br>' + item.innerHTML;
    } else {
      document.getElementById('result').innerHTML = '✗ book-info 未找到！<br>HTML: ' + item.innerHTML;
    }
  </script>
</body>
</html>
