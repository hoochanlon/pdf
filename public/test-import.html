<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>导入测试</title>
</head>
<body>
  <h1>测试 foliate-js 导入</h1>
  <pre id="log"></pre>

  <script type="module">
    const logEl = document.getElementById('log');
    function log(msg) {
      console.log(msg);
      logEl.textContent += msg + '\n';
    }

    async function test() {
      try {
        log('1. 开始导入 /lib/foliate-js/view.js...');
        const module = await import('/lib/foliate-js/view.js');
        log('2. ✓ 导入成功');
        log('3. 模块内容: ' + Object.keys(module).join(', '));
        
        // 等待自定义元素注册
        log('4. 检查 foliate-view 是否已注册...');
        await new Promise(resolve => setTimeout(resolve, 100));
        
        const isRegistered = typeof customElements.get('foliate-view') !== 'undefined';
        log('5. foliate-view 已注册: ' + isRegistered);
        
        if (isRegistered) {
          log('6. 尝试创建元素...');
          const view = document.createElement('foliate-view');
          log('7. ✓ 元素创建成功: ' + view.tagName);
          log('8. 元素方法: ' + Object.getOwnPropertyNames(Object.getPrototypeOf(view)).join(', '));
        }
        
      } catch (error) {
        log('✗ 错误: ' + error.message);
        log('堆栈: ' + error.stack);
      }
    }

    test();
  </script>
</body>
</html>
