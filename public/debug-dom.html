<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>DOM调试</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .success { color: green; }
    .error { color: red; }
    pre { background: #f5f5f5; padding: 10px; }
  </style>
</head>
<body>
  <h1>DOM结构调试</h1>
  <div id="results"></div>
  
  <script type="module">
    setTimeout(() => {
      const results = document.getElementById('results');
      let html = '<h2>检查结果：</h2>';
      
      // 检查book-list
      const list = document.getElementById('book-list');
      html += `<p class="${list ? 'success' : 'error'}">book-list存在: ${!!list}</p>`;
      if (list) {
        html += `<p>book-list子元素数量: ${list.children.length}</p>`;
        html += `<p>book-list innerHTML长度: ${list.innerHTML.length}</p>`;
        
        if (list.children.length > 0) {
          html += '<h3>第一个book-item:</h3>';
          html += `<pre>${list.children[0].outerHTML.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>`;
        }
      }
      
      // 检查sidebar
      const sidebar = document.getElementById('sidebar');
      html += `<p class="${sidebar ? 'success' : 'error'}">sidebar存在: ${!!sidebar}</p>`;
      if (sidebar) {
        const style = getComputedStyle(sidebar);
        html += `<p>sidebar display: ${style.display}</p>`;
        html += `<p>sidebar visibility: ${style.visibility}</p>`;
        html += `<p>sidebar opacity: ${style.opacity}</p>`;
      }
      
      results.innerHTML = html;
    }, 3000);
  </script>
  
  <iframe src="http://localhost:3000" style="width:100%; height:600px; border:1px solid #ccc; margin-top:20px;"></iframe>
</body>
</html>
