<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>模块诊断</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .success { color: green; }
    .error { color: red; }
    .warning { color: orange; }
  </style>
</head>
<body>
  <h1>模块加载诊断</h1>
  <div id="results"></div>
  
  <script type="module">
    const results = document.getElementById('results');
    
    function log(message, type = 'info') {
      const div = document.createElement('div');
      div.className = type;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      results.appendChild(div);
      console.log(message);
    }
    
    log('开始测试模块加载...');
    
    // 按照app.js的顺序测试
    const modules = [
      './js/state.js',
      './js/utils.js',
      './js/pdf.js',
      './js/epub.js',
      './js/sidebar.js',
      './js/library.js',
      './js/reading.js',
      './js/tooltip.js',
      './js/config-init.js',
      './config.js'
    ];
    
    async function testModules() {
      for (const mod of modules) {
        try {
          await import(mod);
          log(`✓ ${mod}`, 'success');
        } catch (e) {
          log(`✗ ${mod}: ${e.message}`, 'error');
          console.error(`详细错误 (${mod}):`, e);
        }
      }
      
      log('测试完成！', 'success');
      
      // 测试config-init
      try {
        const { initConfig } = await import('./js/config-init.js');
        log('尝试调用 initConfig()...', 'warning');
        initConfig();
        log('✓ initConfig() 执行成功', 'success');
        
        // 检查DOM变化
        setTimeout(() => {
          const title = document.title;
          const h1 = document.querySelector('h1');
          log(`当前 document.title: ${title}`, 'warning');
        }, 1000);
      } catch (e) {
        log(`✗ initConfig 失败: ${e.message}`, 'error');
      }
    }
    
    testModules();
  </script>
</body>
</html>
