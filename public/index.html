<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172033">
  <title>在线电子书阅读器</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
  {
    "imports": {
      "/lib/foliate-js/": "/lib/foliate-js/"
    }
  }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <button class="header-btn sidebar-toggle" id="toggle-btn" type="button"
        title="收起书架" aria-label="收起书架" aria-controls="sidebar" aria-expanded="true" data-sidebar-state="expanded">
        <img src="/icons/bookshelf.svg" alt="" aria-hidden="true" style="width: 20px; height: 20px; filter: brightness(0) invert(1);">
      </button>
      <div>
        <h1></h1>
        <p></p>
      </div>
    </div>
    <div class="header-actions">
      <span class="book-count" id="book-count" style="display: none;"></span>
      <div class="social-links">
        <a href="https://github.com/yourusername" target="_blank" rel="noopener noreferrer" class="social-link">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
        </a>
        <a href="https://bsky.app/profile/yourusername.bsky.social" target="_blank" rel="noopener noreferrer" class="social-link">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 10.5c-2.5-2.5-5.5-5.5-6.5-6.5C4.5 3 3 3 2 4.5S1.5 8 3 9.5c1 1 4 4 6 6-2 2-5 5-6 6C1.5 23 1.5 24 3 24s2.5-1 3.5-2c1-1 4-4 5.5-5.5 1.5 1.5 4.5 4.5 5.5 5.5 1 1 2 2 3.5 2s1.5-1 0-2.5c-1-1-4-4-6-6 2-2 5-5 6-6 1.5-1.5 1-3 0-4.5S19.5 3 18.5 4c-1 1-4 4-6.5 6.5z"/>
          </svg>
        </a>
        <a href="mailto:your@email.com" class="social-link">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main class="app-layout">
    <aside class="sidebar" id="sidebar" aria-label="书籍列表">
      <div class="sidebar-heading">
        <div>
          <span class="eyebrow">LIBRARY</span>
          <h2>我的书架</h2>
        </div>
        <span class="sidebar-count" id="sidebar-count">0</span>
      </div>
      <div class="library-tools">
        <div class="library-search-row">
          <label class="library-search">
            <span class="sr-only">搜索书籍</span>
            <input id="book-search" type="search" placeholder="搜索书名或作者" autocomplete="off">
          </label>
        </div>
        <div class="library-actions-row">
          <button class="library-filter-toggle" id="library-filter-toggle" type="button"
            aria-expanded="false" aria-controls="library-filter-panel">
            <span aria-hidden="true">☷</span>
            <span>筛选</span>
            <span class="library-filter-count" id="library-filter-count" aria-hidden="true">0</span>
          </button>
          <button class="library-view-toggle" id="library-view-toggle" type="button">
            <span aria-hidden="true" id="view-icon">⊞</span>
            <span>排列</span>
          </button>
          <button class="library-reset" id="library-reset" type="button" disabled>清除</button>
        </div>
        <div class="library-filter-panel" id="library-filter-panel" hidden>
          <div class="library-filters">
            <label class="library-filter">
              <span>作者</span>
              <select id="book-author-filter" aria-label="按作者筛选">
                <option value="">全部作者</option>
              </select>
            </label>
            <label class="library-filter">
              <span>格式</span>
              <select id="book-format-filter" aria-label="按文件格式筛选">
                <option value="">全部格式</option>
              </select>
            </label>
            <label class="library-filter">
              <span>语言</span>
              <select id="book-language-filter" aria-label="按语言筛选">
                <option value="">全部语言</option>
              </select>
            </label>
            <label class="library-filter library-filter-status">
              <span>阅读状态</span>
              <select id="book-status-filter" aria-label="按阅读状态筛选">
                <option value="">全部状态</option>
              </select>
            </label>
            <label class="library-filter library-filter-category">
              <span>分类</span>
              <select id="book-category-filter" aria-label="按分类筛选">
                <option value="">全部分类</option>
              </select>
            </label>
          </div>
        </div>
      </div>
      <ul class="book-list" id="book-list"></ul>
    </aside>

    <div class="overlay" id="overlay"></div>

    <section class="viewer" aria-label="阅读区域">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon" aria-hidden="true">▧</div>
        <h2 id="empty-state-title">正在加载书籍列表…</h2>
        <p id="empty-state-message"></p>
      </div>

      <div class="pdf-reader" id="pdf-reader">
        <div class="pdf-toolbar">
          <div class="pdf-toolbar-group">
            <button class="reader-btn" id="pdf-sidebar-toggle" type="button" aria-label="显示目录" aria-controls="pdf-sidebar" aria-expanded="false">☰</button>
          </div>
          <div class="pdf-page-jump">
            <label class="sr-only" for="pdf-page-input">跳转到 PDF 页码</label>
            <input id="pdf-page-input" type="number" min="1" inputmode="numeric" placeholder="—" aria-label="跳转到 PDF 页码">
            <span aria-hidden="true">/</span>
            <output id="pdf-page-total">—</output>
          </div>
          <div class="pdf-heading">
            <span class="reader-type">PDF</span>
            <strong id="pdf-title">—</strong>
          </div>
          <div class="pdf-toolbar-group pdf-toolbar-tools">
            <span class="pdf-progress-value" id="pdf-progress-value">0%</span>
            <button class="reader-btn" id="pdf-rotate-clockwise" type="button" title="旋转" aria-label="旋转">↻</button>
            <label class="pdf-zoom-control" for="pdf-zoom-select">
              <span class="sr-only">缩放模式</span>
              <select id="pdf-zoom-select" aria-label="缩放模式">
                <option value="auto">自动</option>
                <option value="page-width">适合宽度</option>
                <option value="page-fit">适合页面</option>
                <option value="page-actual">实际大小</option>
              </select>
            </label>
          </div>
        </div>
        <div class="pdf-workspace">
          <aside class="pdf-sidebar" id="pdf-sidebar" aria-hidden="true">
            <div class="pdf-sidebar-header">目录</div>
            <ul class="pdf-outline" id="pdf-outline"></ul>
          </aside>
          <div class="pdf-viewer-container" id="pdf-viewer-container" tabindex="0" aria-label="PDF 阅读内容">
            <div id="pdf-viewer" class="pdfViewer"></div>
          </div>
        </div>
        <div class="pdf-progress-wrap" aria-label="PDF 阅读进度">
          <div class="pdf-progress-bar" id="pdf-progress-bar"></div>
        </div>
      </div>

      <div class="epub-reader" id="epub-reader">
        <div class="epub-toolbar">
          <div class="epub-nav-group">
            <button class="reader-btn" id="epub-toc" type="button" aria-label="显示目录" aria-controls="epub-sidebar" aria-expanded="false">☰</button>
          </div>
          <div class="epub-heading">
            <span class="reader-type">EPUB</span>
            <strong id="epub-title">正在加载…</strong>
          </div>
          <div class="epub-tools">
            <span class="epub-progress-value" id="epub-progress-value">0%</span>
          </div>
        </div>
        <div class="epub-workspace">
          <aside class="pdf-sidebar" id="epub-sidebar" aria-hidden="true">
            <div class="pdf-sidebar-header">目录</div>
            <ul class="pdf-outline" id="epub-toc-list"></ul>
          </aside>
          <div class="epub-container" id="epub-container" aria-label="EPUB 阅读内容"></div>
        </div>
        <div class="epub-status" id="epub-status" role="status" aria-live="polite">
          <div class="epub-status-card">
            <span class="epub-status-spinner" aria-hidden="true"></span>
            <strong id="epub-status-title">正在加载 EPUB</strong>
            <span id="epub-status-detail">正在准备阅读内容…</span>
          </div>
        </div>
        <div class="epub-progress-wrap" aria-label="EPUB 阅读进度" id="epub-progress-wrap">
          <div class="epub-progress-track">
            <div class="epub-progress-bar" id="epub-progress-bar"></div>
          </div>
          <span class="epub-progress-percent" id="epub-progress-percent">0%</span>
        </div>
      </div>

      <div class="mobi-reader" id="mobi-reader">
        <div class="epub-toolbar">
          <div class="epub-nav-group">
            <button class="reader-btn" id="mobi-toc" type="button" aria-label="显示目录" aria-controls="mobi-sidebar" aria-expanded="false">☰</button>
          </div>
          <div class="epub-heading">
            <span class="reader-type">MOBI</span>
            <strong id="mobi-title">正在加载…</strong>
          </div>
          <div class="epub-tools">
            <span class="epub-progress-value" id="mobi-progress-value">0%</span>
          </div>
        </div>
        <div class="mobi-workspace">
          <aside class="pdf-sidebar" id="mobi-sidebar" aria-hidden="true">
            <div class="pdf-sidebar-header">目录</div>
            <ul class="pdf-outline" id="mobi-toc-list"></ul>
          </aside>
          <div class="mobi-container" id="mobi-container" aria-label="MOBI 阅读内容"></div>
        </div>
        <div class="epub-status" id="mobi-status" role="status" aria-live="polite">
          <div class="epub-status-card">
            <span class="epub-status-spinner" aria-hidden="true"></span>
            <strong id="mobi-status-title">正在加载 MOBI</strong>
            <span id="mobi-status-detail">正在准备阅读内容…</span>
          </div>
        </div>
        <div class="epub-progress-wrap" aria-label="MOBI 阅读进度" id="mobi-progress-wrap">
          <div class="epub-progress-track">
            <div class="epub-progress-bar" id="mobi-progress-bar"></div>
          </div>
          <span class="epub-progress-percent" id="mobi-progress-percent">0%</span>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./app.js?v=15"></script>
  <script>
    // 简单验证脚本
    window.addEventListener('load', () => {
      setTimeout(() => {
        const list = document.getElementById('book-list');
        const count = list ? list.children.length : 0;
        console.log('[验证] book-list子元素数量:', count);
        if (count === 0) {
          console.error('[验证] 书籍列表为空！可能的问题：');
          console.error('- JavaScript未执行');
          console.error('- 数据加载失败');
          console.error('- 渲染失败');
        } else {
          console.log('[验证] ✓ 成功加载', count, '本书');
        }
      }, 2000);
    });
  </script>
</body>
</html>
