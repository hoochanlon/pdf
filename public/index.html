<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172033">
  <title>在线电子书阅读器</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">▤</div>
      <div>
        <h1>在线电子书阅读器</h1>
        <p>在浏览器中阅读你的 PDF 与 EPUB</p>
      </div>
    </div>
    <div class="header-actions">
      <span class="book-count" id="book-count">0 本书</span>
      <button class="header-btn sidebar-toggle" id="toggle-btn" type="button"
        title="收起书架" aria-label="收起书架" aria-controls="sidebar" aria-expanded="true" data-sidebar-state="expanded">
        <span class="sidebar-toggle-icon" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main class="app-layout">
    <aside class="sidebar" id="sidebar" aria-label="书籍列表">
      <div class="sidebar-heading">
        <div>
          <span class="eyebrow">LIBRARY</span>
          <h2>我的书架</h2>
        </div>
        <span class="sidebar-count" id="sidebar-count">0</span>
      </div>
      <div class="library-state" id="library-state" role="status">正在读取 books.json…</div>
      <ul class="book-list" id="book-list"></ul>
    </aside>

    <div class="sidebar-resizer" id="sidebar-resizer" role="separator" aria-label="调整书籍列表宽度" aria-orientation="vertical" tabindex="0"></div>
    <div class="overlay" id="overlay"></div>

    <section class="viewer" aria-label="阅读区域">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon" aria-hidden="true">▧</div>
        <h2>选择一本书开始阅读</h2>
        <p>书籍会自动从 <code>books.json</code> 读取</p>
      </div>

      <iframe id="pdf-frame" title="PDF 阅读器"></iframe>
      <div id="pdf-canvas-container" aria-label="PDF 连续阅读区域"></div>

      <div class="epub-reader" id="epub-reader">
        <div class="epub-toolbar">
          <div class="epub-nav-group">
            <button class="reader-btn reader-btn-secondary" id="epub-chapter-prev" type="button" title="上一章" aria-label="上一章">|‹</button>
            <button class="reader-btn" id="epub-prev" type="button" title="上一页" aria-label="上一页">‹</button>
          </div>
          <div class="epub-heading">
            <span class="reader-type">EPUB</span>
            <strong id="epub-title">正在加载…</strong>
            <span class="epub-location" id="epub-location" aria-live="polite">第 — / — 页</span>
          </div>
          <div class="epub-tools">
            <label class="epub-mode-control" for="epub-mode-select">
              <span class="sr-only">阅读模式</span>
              <select id="epub-mode-select" aria-label="阅读模式">
                <option value="scroll">连续滚动</option>
                <option value="paginated">分页阅读</option>
              </select>
            </label>
            <div class="epub-page-jump">
              <label class="sr-only" for="epub-page-input">跳转到页码</label>
              <input id="epub-page-input" type="number" min="1" inputmode="numeric" placeholder="—" aria-label="跳转到页码">
              <span aria-hidden="true">/</span>
              <output id="epub-page-total">—</output>
            </div>
            <button class="reader-btn" id="epub-next" type="button" title="下一页" aria-label="下一页">›</button>
            <button class="reader-btn reader-btn-secondary" id="epub-chapter-next" type="button" title="下一章" aria-label="下一章">›|</button>
            <button class="reader-btn" id="epub-toc" type="button" title="打开目录" aria-label="打开目录">☰</button>
          </div>
        </div>
        <div class="epub-container" id="epub-container" aria-label="EPUB 阅读内容"></div>
        <div class="epub-status" id="epub-status" role="status" aria-live="polite">
          <div class="epub-status-card">
            <span class="epub-status-spinner" aria-hidden="true"></span>
            <strong id="epub-status-title">正在加载 EPUB</strong>
            <span id="epub-status-detail">正在准备阅读内容…</span>
          </div>
        </div>
        <div class="epub-progress-wrap" aria-hidden="true">
          <div class="epub-progress-bar" id="epub-progress-bar"></div>
        </div>
      </div>

      <div class="epub-toc-panel" id="epub-toc-panel" aria-hidden="true">
        <div class="epub-toc-header">
          <strong>目录</strong>
          <button class="toc-close" id="epub-toc-close" type="button" aria-label="关闭目录">×</button>
        </div>
        <ul class="epub-toc-list" id="epub-toc-list"></ul>
      </div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
