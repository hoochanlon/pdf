<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172033">
  <script>
    (() => {
      document.documentElement.classList.remove('app-ready');
      try {
        const supported = ['zh-CN', 'ja-JP', 'en-US'];
        const saved = localStorage.getItem('app-language');
        const browserLang = navigator.language || navigator.userLanguage || 'zh-CN';
        const preferred = supported.find(code => code === saved) ||
          supported.find(code => code === browserLang || code.startsWith(browserLang.split('-')[0])) ||
          'zh-CN';
        document.documentElement.lang = preferred;
      } catch (error) {
        document.documentElement.lang = 'zh-CN';
      }
    })();
  </script>
  <title data-i18n="site.title">在线电子书阅读器</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
  {
    "imports": {
      "/lib/foliate-js/": "/lib/foliate-js/"
    }
  }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <button class="header-btn sidebar-toggle" id="toggle-btn" type="button"
        aria-label="收起书架" aria-controls="sidebar" aria-expanded="true" data-sidebar-state="expanded">
        <img src="./icons/bookshelf.svg" alt="" aria-hidden="true" style="width: 20px; height: 20px; filter: brightness(0) invert(1);">
      </button>
      <div>
        <h1 data-i18n="site.title"></h1>
        <p data-i18n="site.subtitle"></p>
      </div>
    </div>
    <div class="header-actions">
      <span class="book-count" id="book-count" style="display: none;"></span>
      <div class="language-selector">
        <button class="language-toggle" id="language-toggle" type="button" data-i18n-aria-label="common.switchLanguage" aria-label="切换语言" aria-haspopup="listbox" aria-expanded="false">
          <img class="language-icon" src="./icons/translate.svg" alt="" aria-hidden="true" width="20" height="20">
          <img class="language-flag" id="current-language-flag" src="./icons/china.svg" alt="" aria-hidden="true" width="16" height="16">
        </button>
        <div class="language-dropdown" id="language-dropdown" role="listbox" data-i18n-aria-label="common.selectLanguage" aria-label="选择语言" hidden>
          <button class="language-option" data-lang="zh-CN" role="option" aria-selected="true">
            <img class="language-flag" src="./icons/china.svg" alt="" aria-hidden="true" width="18" height="18">
            <span class="language-name">中文</span>
          </button>
          <button class="language-option" data-lang="ja-JP" role="option" aria-selected="false">
            <img class="language-flag" src="./icons/jp.svg" alt="" aria-hidden="true" width="18" height="18">
            <span class="language-name">日本語</span>
          </button>
          <button class="language-option" data-lang="en-US" role="option" aria-selected="false">
            <img class="language-flag" src="./icons/us.svg" alt="" aria-hidden="true" width="18" height="18">
            <span class="language-name">English</span>
          </button>
        </div>
      </div>
      <div class="social-links">
        <a href="https://github.com/yourusername" target="_blank" rel="noopener noreferrer" class="social-link">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
        </a>
        <a href="https://bsky.app/profile/yourusername.bsky.social" target="_blank" rel="noopener noreferrer" class="social-link">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 10.5c-2.5-2.5-5.5-5.5-6.5-6.5C4.5 3 3 3 2 4.5S1.5 8 3 9.5c1 1 4 4 6 6-2 2-5 5-6 6C1.5 23 1.5 24 3 24s2.5-1 3.5-2c1-1 4-4 5.5-5.5 1.5 1.5 4.5 4.5 5.5 5.5 1 1 2 2 3.5 2s1.5-1 0-2.5c-1-1-4-4-6-6 2-2 5-5 6-6 1.5-1.5 1-3 0-4.5S19.5 3 18.5 4c-1 1-4 4-6.5 6.5z"/>
          </svg>
        </a>
        <a href="mailto:your@email.com" class="social-link">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main class="app-layout">
    <aside class="sidebar" id="sidebar" data-i18n-aria-label="library.ariaBookList" aria-label="书籍列表">

      <!-- Tab 导航 -->
      <div class="sidebar-tabs" role="tablist" data-i18n-aria-label="library.ariaTabs" aria-label="书库切换">
        <button class="sidebar-tab" id="tab-online" role="tab"
          aria-selected="true" aria-controls="panel-online" type="button">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <span class="sidebar-tab-label" data-i18n="library.online">在线书库</span>
          <span class="tab-count" id="sidebar-count">0</span>
        </button>
        <button class="sidebar-tab" id="tab-local" role="tab"
          aria-selected="false" aria-controls="panel-local" type="button">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <span class="sidebar-tab-label" data-i18n="library.local">本地书库</span>
          <span class="tab-count" id="local-count">0</span>
        </button>
      </div>

      <!-- 在线书库面板 -->
      <div class="sidebar-panel" id="panel-online" role="tabpanel" aria-labelledby="tab-online">
        <div class="library-tools">
          <div class="library-search-row">
            <label class="library-search">
              <span class="sr-only" data-i18n="library.search">搜索书名或作者</span>
              <input id="book-search" type="search" data-i18n-placeholder="library.search" placeholder="搜索书名或作者" autocomplete="off">
            </label>
          </div>
          <div class="library-actions-row">
            <button class="library-filter-toggle" id="library-filter-toggle" type="button"
              aria-expanded="false" aria-controls="library-filter-panel">
              <span aria-hidden="true">☷</span>
              <span data-i18n="library.filter">筛选</span>
              <span class="library-filter-count" id="library-filter-count" aria-hidden="true">0</span>
            </button>
            <button class="library-view-toggle" id="library-view-toggle" type="button">
              <span aria-hidden="true" id="view-icon">⊞</span>
              <span data-i18n="library.view">排列</span>
            </button>
            <button class="library-reset" id="library-reset" type="button" disabled data-i18n-aria-label="library.reset" aria-label="清除筛选条件">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true"><path d="M4.252 4v5H9M5.07 8a8 8 0 1 1-.818 6"/></svg>
            </button>
            <button class="library-clear-progress" id="library-clear-progress" type="button" data-i18n-aria-label="library.clearProgress" aria-label="清除所有阅读进度">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m21 3l-8 8.5m-3.554-.415c-2.48.952-4.463.789-6.446.003c.5 6.443 3.504 8.92 7.509 9.912c0 0 3.017-2.134 3.452-7.193c.047-.548.07-.821-.043-1.13c-.114-.309-.338-.53-.785-.973c-.736-.728-1.103-1.092-1.54-1.184c-.437-.09-1.007.128-2.147.565"/><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 16.446S7 16.93 9.5 15"/><path d="M8.5 7.25a1.25 1.25 0 1 1-2.5 0a1.25 1.25 0 0 1 2.5 0Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M11.125 4H11m.25 0a.25.25 0 1 1-.5 0a.25.25 0 0 1 .5 0"/></svg>
            </button>
          </div>
          <div class="library-filter-panel" id="library-filter-panel" hidden>
            <div class="library-filters">
              <div class="library-filter">
                <span id="filter-label-author" data-i18n="library.author">作者</span>
                <div class="cs-wrap cs-wrap--filter" id="cs-author-wrap">
                  <button class="cs-trigger" type="button"
                    aria-haspopup="listbox" aria-expanded="false" aria-labelledby="filter-label-author">
                    <span class="cs-label" data-i18n="library.allAuthors">全部作者</span>
                    <span class="cs-arrow" aria-hidden="true"></span>
                  </button>
                  <div class="cs-listbox" role="listbox" aria-labelledby="filter-label-author" hidden></div>
                </div>
              </div>
              <div class="library-filter">
                <span id="filter-label-type" data-i18n="library.type">类型</span>
                <div class="cs-wrap cs-wrap--filter" id="cs-type-wrap">
                  <button class="cs-trigger" type="button"
                    aria-haspopup="listbox" aria-expanded="false" aria-labelledby="filter-label-type">
                    <span class="cs-label" data-i18n="library.allTypes">全部类型</span>
                    <span class="cs-arrow" aria-hidden="true"></span>
                  </button>
                  <div class="cs-listbox" role="listbox" aria-labelledby="filter-label-type" hidden></div>
                </div>
              </div>
              <div class="library-filter">
                <span id="filter-label-format" data-i18n="library.format">格式</span>
                <div class="cs-wrap cs-wrap--filter" id="cs-format-wrap">
                  <button class="cs-trigger" type="button"
                    aria-haspopup="listbox" aria-expanded="false" aria-labelledby="filter-label-format">
                    <span class="cs-label" data-i18n="library.allFormats">全部格式</span>
                    <span class="cs-arrow" aria-hidden="true"></span>
                  </button>
                  <div class="cs-listbox" role="listbox" aria-labelledby="filter-label-format" hidden></div>
                </div>
              </div>
              <div class="library-filter library-filter-category">
                <span id="filter-label-category" data-i18n="library.category">分类</span>
                <div class="cs-wrap cs-wrap--filter" id="cs-category-wrap">
                  <button class="cs-trigger" type="button"
                    aria-haspopup="listbox" aria-expanded="false" aria-labelledby="filter-label-category">
                    <span class="cs-label" data-i18n="library.allCategories">全部分类</span>
                    <span class="cs-arrow" aria-hidden="true"></span>
                  </button>
                  <div class="cs-listbox" role="listbox" aria-labelledby="filter-label-category" hidden></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <ul class="book-list" id="book-list"></ul>
      </div>

      <!-- 本地书库面板 -->
      <div class="sidebar-panel" id="panel-local" role="tabpanel" aria-labelledby="tab-local" hidden>
        <div class="library-tools">
          <div class="library-search-row">
            <label class="library-search">
              <span class="sr-only" data-i18n="library.searchLocal">搜索本地书籍</span>
              <input id="local-book-search" type="search" data-i18n-placeholder="library.searchLocal" placeholder="搜索书名或作者" autocomplete="off">
            </label>
          </div>
          <div class="library-actions-row">
            <button class="library-filter-toggle" id="local-filter-toggle" type="button"
              aria-expanded="false" aria-controls="local-filter-panel">
              <span aria-hidden="true">☷</span>
              <span data-i18n="library.filter">筛选</span>
              <span class="library-filter-count" id="local-filter-count" aria-hidden="true">0</span>
            </button>
            <button class="library-view-toggle" id="local-view-toggle" type="button">
              <span aria-hidden="true" id="local-view-icon">⊞</span>
              <span data-i18n="library.view">排列</span>
            </button>
            <button class="library-reset" id="local-filter-reset" type="button" disabled data-i18n-aria-label="library.reset" aria-label="清除筛选条件">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" aria-hidden="true"><path d="M4.252 4v5H9M5.07 8a8 8 0 1 1-.818 6"/></svg>
            </button>
            <button class="library-clear-progress" id="local-clear-progress" type="button" hidden data-i18n-aria-label="library.clearProgress" aria-label="清除所有阅读进度">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m21 3l-8 8.5m-3.554-.415c-2.48.952-4.463.789-6.446.003c.5 6.443 3.504 8.92 7.509 9.912c0 0 3.017-2.134 3.452-7.193c.047-.548.07-.821-.043-1.13c-.114-.309-.338-.53-.785-.973c-.736-.728-1.103-1.092-1.54-1.184c-.437-.09-1.007.128-2.147.565"/><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 16.446S7 16.93 9.5 15"/><path d="M8.5 7.25a1.25 1.25 0 1 1-2.5 0a1.25 1.25 0 0 1 2.5 0Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M11.125 4H11m.25 0a.25.25 0 1 1-.5 0a.25.25 0 0 1 .5 0"/></svg>
            </button>
            <button class="library-clear-all" id="local-clear-all" type="button" hidden data-i18n-aria-label="library.clearAll" aria-label="清空书库">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M4 1C2.348 1 1 2.348 1 4a3.01 3.01 0 0 0 2.112 2.866l2.243 18.628A3 3 0 0 0 4 28c0 1.652 1.348 3 3 3h18c1.652 0 3-1.348 3-3c0-1.07-.564-2.01-1.41-2.542l2.236-18.574A3.01 3.01 0 0 0 31 4c0-1.652-1.348-3-3-3zM3 4c0-.548.452-1 1-1h24c.548 0 1 .452 1 1s-.452 1-1 1H4c-.548 0-1-.452-1-1m22.972 3l-.636 5.275l-.332.632l-1.86-3.535L24.39 7zm-3.857 0l-.11.21l-.11-.21zm-2.497 0l1.248 2.375l-1.812 3.445l-1.904-3.619L18.308 7zm-3.594 0l-.016.03l-.016-.03zm-2.316 0l1.158 2.201l-1.904 3.62l-1.813-3.448L12.397 7zm-3.593 0l-.107.204L9.9 7zM7.616 7l1.25 2.377l-1.857 3.535l-.427-.812L5.968 7zm3.468 18H8.839l1.123-2.133zm6 0H14.93l1.077-2.048zm6.092 0H20.93l1.122-2.134zm.019-4.306l1.463-2.783l-.546 4.527zM7.26 17.732l1.558 2.963l-.977 1.859zm14.743-6.192l1.86 3.538l-1.812 3.444l-1.859-3.536zm-2.953 5.619l1.86 3.535l-1.904 3.62l-1.859-3.535zm-6.043 7.156l-1.904-3.62l1.858-3.532l1.904 3.62zm3-5.704l-1.904-3.62l1.904-3.618l1.904 3.62zm-6.046-.087l-1.814-3.447l1.859-3.533l1.813 3.448zM7 27h18c.548 0 1 .452 1 1s-.452 1-1 1H7c-.548 0-1-.452-1-1s.452-1 1-1"/></svg>
            </button>
          </div>
          <div class="library-filter-panel" id="local-filter-panel" hidden>
            <div class="library-filters">
              <div class="library-filter">
                <span id="local-filter-label-author" data-i18n="library.author">作者</span>
                <div class="cs-wrap cs-wrap--filter" id="local-cs-author-wrap">
                  <button class="cs-trigger" type="button"
                    aria-haspopup="listbox" aria-expanded="false" aria-labelledby="local-filter-label-author">
                    <span class="cs-label" data-i18n="library.allAuthors">全部作者</span>
                    <span class="cs-arrow" aria-hidden="true"></span>
                  </button>
                  <div class="cs-listbox" role="listbox" aria-labelledby="local-filter-label-author" hidden></div>
                </div>
              </div>
              <div class="library-filter">
                <span id="local-filter-label-format" data-i18n="library.format">格式</span>
                <div class="cs-wrap cs-wrap--filter" id="local-cs-format-wrap">
                  <button class="cs-trigger" type="button"
                    aria-haspopup="listbox" aria-expanded="false" aria-labelledby="local-filter-label-format">
                    <span class="cs-label" data-i18n="library.allFormats">全部格式</span>
                    <span class="cs-arrow" aria-hidden="true"></span>
                  </button>
                  <div class="cs-listbox" role="listbox" aria-labelledby="local-filter-label-format" hidden></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="local-actions">
          <button class="local-btn local-btn--primary" id="local-open-dir" type="button">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            <span data-i18n="library.openFolder">打开文件夹</span>
          </button>
          <button class="local-btn local-btn--secondary" id="local-open-file" type="button">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <span data-i18n="library.selectFile">选择文件</span>
          </button>
        </div>
        <p class="local-dir-name" id="local-dir-name" hidden></p>
        <p class="local-empty" id="local-empty"></p>
        <ul class="book-list view-list" id="local-book-list"></ul>
      </div>

    </aside>

    <div class="overlay" id="overlay"></div>

    <section class="viewer" data-i18n-aria-label="reader.viewerArea" aria-label="阅读区域">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 512 512"><path fill="currentColor" d="M352 96c0-53.02-42.98-96-96-96s-96 42.98-96 96s42.98 96 96 96s96-42.98 96-96M233.59 241.1c-59.33-36.32-155.43-46.3-203.79-49.05C13.55 191.13 0 203.51 0 219.14v222.8c0 14.33 11.59 26.28 26.49 27.05c43.66 2.29 131.99 10.68 193.04 41.43c9.37 4.72 20.48-1.71 20.48-11.87V252.56c-.01-4.67-2.32-8.95-6.42-11.46m248.61-49.05c-48.35 2.74-144.46 12.73-203.78 49.05c-4.1 2.51-6.41 6.96-6.41 11.63v245.79c0 10.19 11.14 16.63 20.54 11.9c61.04-30.72 149.32-39.11 192.97-41.4c14.9-.78 26.49-12.73 26.49-27.06V219.14c-.01-15.63-13.56-28.01-29.81-27.09"/></svg>
        </div>
        <h2 id="empty-state-title">正在加载书籍列表…</h2>
        <p id="empty-state-message"></p>
      </div>

      <div class="pdf-reader" id="pdf-reader">
        <div class="pdf-toolbar">
          <div class="pdf-toolbar-group">
            <button class="reader-btn" id="pdf-sidebar-toggle" type="button" data-i18n-aria-label="reader.showTOC" aria-label="显示目录" aria-controls="pdf-sidebar" aria-expanded="false">☰</button>
          </div>
          <div class="pdf-page-jump">
            <label class="sr-only" for="pdf-page-input" data-i18n="reader.pageJump">跳转到 PDF 页码</label>
            <input id="pdf-page-input" type="number" min="1" inputmode="numeric" placeholder="—" data-i18n-aria-label="reader.pageJump" aria-label="跳转到 PDF 页码">
            <span aria-hidden="true">/</span>
            <output id="pdf-page-total">—</output>
          </div>
          <div class="pdf-heading">
            <strong id="pdf-title">—</strong>

  <script>
    // 简单验证脚本
    window.addEventListener('load', () => {
      setTimeout(() => {
        const list = document.getElementById('book-list');
        const count = list ? list.children.length : 0;
        console.log('[验证] book-list子元素数量:', count);
        if (count === 0) {
          console.error('[验证] 书籍列表为空！可能的问题：');
          console.error('- JavaScript未执行');
          console.error('- 数据加载失败');
          console.error('- 渲染失败');
        } else {
          console.log('[验证] ✓ 成功加载', count, '本书');
        }
      }, 2000);
    });
  </script>
