name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static book catalog
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('public/uploads')
          books = [
              item.name
              for item in sorted(source.iterdir(), key=lambda path: path.name.casefold())
              if item.is_file() and item.suffix.lower() in {'.pdf', '.epub'}
          ]

          Path('public/books.json').write_text(
              json.dumps(books, ensure_ascii=False, indent=2) + '\\n',
              encoding='utf-8'
          )
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
