name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server-side JavaScript syntax
        shell: bash
        run: |
          node --check server.js

      - name: Smoke test HTTP endpoints
        shell: bash
        run: |
          node server.js >/tmp/pdf-reader-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              if curl --fail --silent --show-error http://127.0.0.1:3000/api/books >/dev/null; then
                exit 0
              fi
            fi
            sleep 1
          done

          exit 1
