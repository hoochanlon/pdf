name: 自动提取书籍封面

on:
  push:
    paths:
      - 'public/uploads/*.pdf'
      - 'public/uploads/*.epub'
      - 'public/uploads/*.mobi'
  workflow_dispatch:

jobs:
  extract-covers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install Pillow PyMuPDF ebooklib
          
      - name: Extract covers
        run: |
          python scripts/extract_covers.py
          
      - name: Commit covers
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/covers/
          git diff --staged --quiet || git commit -m "自动提取书籍封面 [skip ci]"
          git push
